# -*- coding: utf-8 -*-
# vim: ft=yaml
---
# For help on this file's format, see https://kitchen.ci/
driver:
  name: docker
  use_sudo: false
  privileged: true
  run_command: /usr/lib/systemd/systemd

provisioner:
  name: salt_solo
  log_level: debug
  salt_install: none
  require_chef: false
  formula: ufw
  salt_copy_filter:
    - .kitchen
    - .git

platforms:
  - name: debian-13-3008-2
    driver:
      image: saltimages/salt-3008.2-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-13-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-13
      run_command: /lib/systemd/systemd
  - name: debian-11-3006-27
    driver:
      image: saltimages/salt-3006.27-py3:debian-11
      run_command: /lib/systemd/systemd
      # Since the end of LTS (2026-08-31) deb.debian.org still indexes
      # bullseye-security, but its packages moved to archive.debian.org.
      provision_command:
        - >-
          sed -i 's#deb.debian.org/debian-security#archive.debian.org/debian-security#'
          /etc/apt/sources.list && apt-get update

verifier:
  # https://www.inspec.io/
  name: inspec
  sudo: true
  reporter:
    # cli, documentation, html, progress, json, json-min, json-rspec, junit
    - cli

suites:
  - name: default
    includes:
      - debian-13-3008-2
      - debian-13-3006-27
      - debian-11-3006-27
    provisioner:
      state_top:
        base:
          '*':
            - ufw._mapdata
            - ufw
      pillars:
        top.sls:
          base:
            '*':
              - ufw
      pillars_from_files:
        ufw.sls: test/salt/pillar/default.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
  - name: without-ipv6
    provisioner:
      state_top:
        base:
          '*':
            - ufw._mapdata
            - ufw
      pillars:
        top.sls:
          base:
            '*':
              - ufw
              - without-ipv6
      pillars_from_files:
        ufw.sls: test/salt/pillar/default.sls
        without-ipv6.sls: test/salt/pillar/without-ipv6.sls
    verifier:
      inspec_tests:
        - path: test/integration/default
